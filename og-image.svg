<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0d15"/>
      <stop offset="50%" stop-color="#1a1428"/>
      <stop offset="100%" stop-color="#0f0d15"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="280" r="350" fill="url(#glow)"/>
  <!-- Logo -->
  <rect x="525" y="110" width="150" height="150" rx="32" fill="url(#grad)"/>
  <text x="600" y="222" font-family="Georgia, serif" font-size="100" font-weight="900" fill="white" text-anchor="middle">F</text>
  <!-- Title -->
  <text x="600" y="380" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-3">Fontora</text>
  <!-- Subtitle line -->
  <rect x="420" y="415" width="360" height="4" rx="2" fill="url(#grad)"/>
  <!-- Description -->
  <text x="600" y="475" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="500" fill="#c4b5fd" text-anchor="middle">730+ Free Fonts across 40+ Languages</text>
  <text x="600" y="520" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="400" fill="#9a93b0" text-anchor="middle">Wedding · ગુજરાતી · हिंदी · தமிழ் · 中文 · 日本語 · العربية · Русский</text>
  <!-- URL pill -->
  <rect x="485" y="555" width="230" height="48" rx="24" fill="#1c1828" stroke="#2d2840" stroke-width="2"/>
  <text x="600" y="587" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="url(#grad)" text-anchor="middle">fontora.fun</text>
</svg>